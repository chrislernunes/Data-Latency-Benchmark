name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Python tests
        run: python -m pytest -q
      - name: Install CMake
        run: sudo apt-get update && sudo apt-get install -y cmake g++
      - name: Release build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build
      - name: C++ tests
        run: ./build/orderbook_tests
      - name: Python/C++ parity
        run: python -m src.python.cli compare --input tests/fixtures/parity.jsonl --cpp-bin ./build/binance_md_benchmark
      - name: Gap fixture stays unsuccessful and still matches
        run: |
          python -m src.python.cli compare --input tests/fixtures/gap.jsonl --cpp-bin ./build/binance_md_benchmark
          set +e
          python -m src.python.cli replay --input tests/fixtures/gap.jsonl --engine python >/dev/null
          test $? -eq 3
